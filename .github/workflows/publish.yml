name: Refresh and Publish Report

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download existing sales history
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_USER: ${{ secrets.DREAMHOST_USER }}
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DREAMHOST_TARGET_DIR: ${{ secrets.DREAMHOST_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh public
          printf '%s\n' "$DREAMHOST_SSH_KEY" > ~/.ssh/dreamhost_key
          chmod 600 ~/.ssh/dreamhost_key
          scp -i ~/.ssh/dreamhost_key -o StrictHostKeyChecking=no "$DREAMHOST_USER@$DREAMHOST_HOST:$DREAMHOST_TARGET_DIR/sales-history.json" public/sales-history.json || true

      - name: Refresh Red61 report
        env:
          RED61_DATALINK_URL: ${{ secrets.RED61_DATALINK_URL }}
          RED61_USER: ${{ secrets.RED61_USER }}
          RED61_PASSWORD: ${{ secrets.RED61_PASSWORD }}
          SHOW_CAPACITY: ${{ vars.SHOW_CAPACITY || '87' }}
        run: npm run refresh

      - name: Upload to DreamHost
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DREAMHOST_HOST }}
          username: ${{ secrets.DREAMHOST_USER }}
          key: ${{ secrets.DREAMHOST_SSH_KEY }}
          source: "public/index.html,public/sales-history.json"
          target: ${{ secrets.DREAMHOST_TARGET_DIR }}
          strip_components: 1
